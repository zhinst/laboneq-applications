repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4 # must match the version used in pyproject.toml
    hooks:
      - id: ruff
        exclude: ^docs/
      - id: ruff-format
        exclude: ^docs/
  - repo: local
    hooks:
      - id: check-license
        name: check-license
        entry: python ci/scripts/check_license.py src/ tests/ --fix
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa
        name: nbqa-ruff
        entry: nbqa ruff
        additional_dependencies: [ruff==0.12.4]
        language: python
        types: [jupyter]
        files: ^docs/sources/
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.7 # uv version
    hooks:
      # Update the uv lockfile
      - id: uv-lock


