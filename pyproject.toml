[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laboneq_applications"
description = "Library of LabOne Q experiments, analysis functions, and more."
# Always the version of laboneq, set by `ci/scripts/set_version.py` and `just bump-version`.
version = "26.10.0"
license = { text = "Apache 2.0" }
requires-python = ">=3.10"
readme = "README.md"
authors = [
  { name = "Zurich Instruments Development Team", email = "info@zhinst.com" },
]
keywords = ["quantum", "sdk", "zhinst"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "laboneq ~= 26.10.0",
  "typing_extensions >= 4.5.0",
  "uncertainties >= 3.2.2",
  "numpy >= 2",
  "scipy >= 1.12",
  "matplotlib >= 3.10",
  "lmfit >= 1.3.0",
  "scikit-learn >= 1.5.2",
  "qiskit >= 2.0.0",
  "qiskit_experiments >= 0.10.0",
]

[project.urls]
Changelog = "https://docs.zhinst.com/labone_q_user_manual/release_notes/"
Documentation = "https://docs.zhinst.com/labone_q_user_manual/applications_library/"
GitHub = "https://github.com/zhinst/laboneq-applications"

[dependency-groups]
# Runs the tests, the documentation notebooks and ruff.
dev = [
  "filelock >= 3.12",
  "freezegun >= 1.5.1",
  "nbmake >= 1.5.5",
  "pytest >= 8.3.4",
  "pytest-xdist >= 3.6.1",
  "qcodes >= 0.52.0",
  "ruff ==0.15.12",
  "scikit-optimize >= 0.10.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["laboneq_applications*"]
namespaces = false

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*", "SmokeTest*"]

[tool.ruff]

# laboneq is a dependency of this package, so its imports sort as third-party.
src = ["src", "benchmarks"]

# The public repository does not extend the LabOne Q config, so the rules and settings
# below repeat what it needs of it.
[tool.ruff.lint]
extend-select = ["B", "PERF", "E", "W", "YTT", "Q", "I", "FA", "RUF022"]
ignore = [
  "E501",
  "F405",
  "E741",
  "E722",
  "E402",
  "E731",
  "B905",
  # Workflows and tasks evaluate type hints at run-time.
  "TC",
]

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "tests",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
tests = ["tests"]

[tool.ruff.lint.extend-per-file-ignores]
# Notebooks utilize `from laboneq.simple import *`.
"*.ipynb" = ["F403"]
# Documentation notebooks, as for `examples/` of laboneq
"docs/sources/**/*.ipynb" = ["F811", "PERF"]

[tool.ruff.format]
docstring-code-format = true
