<svg xmlns="http://www.w3.org/2000/svg" viewBox="400 30 480 670" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" />
    </marker>
    <style>
      .txt-title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 300; fill: #111111; }
      .txt-task { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 300; fill: #2fa5e8; }
      .txt-workflow { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 300; fill: #111111; }
      .txt-legend-black { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 300; fill: #111111; }
      .txt-legend-blue { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 300; fill: #2fa5e8; }
    </style>
  </defs>

  <!-- Background (Optional: remove if you want a transparent background for your slides) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Main Container -->
  <rect x="420" y="50" width="440" height="580" fill="none" stroke="#111111" stroke-width="1.5" />
  <text x="450" y="100" class="txt-title">Experiment Workflow</text>

  <!-- 1. create -->
  <rect x="450" y="140" width="240" height="50" fill="none" stroke="#2fa5e8" stroke-width="1.5" />
  <text x="470" y="174" class="txt-task">create</text>
  <line x1="570" y1="190" x2="570" y2="220" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. compile -->
  <rect x="450" y="225" width="240" height="50" fill="none" stroke="#2fa5e8" stroke-width="1.5" />
  <text x="470" y="259" class="txt-task">compile</text>
  <line x1="570" y1="275" x2="570" y2="305" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. run -->
  <rect x="450" y="310" width="240" height="50" fill="none" stroke="#2fa5e8" stroke-width="1.5" />
  <text x="470" y="344" class="txt-task">run</text>
  <line x1="570" y1="360" x2="570" y2="390" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4. Analysis Workflow -->
  <rect x="450" y="395" width="240" height="50" fill="none" stroke="#111111" stroke-width="1.5" />
  <text x="470" y="429" class="txt-workflow">Analysis Workflow</text>
  <line x1="570" y1="445" x2="570" y2="475" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. evaluate -->
  <rect x="450" y="480" width="240" height="50" fill="none" stroke="#2fa5e8" stroke-width="1.5" />
  <text x="470" y="514" class="txt-task">evaluate</text>
  <line x1="570" y1="530" x2="570" y2="560" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 6. update -->
  <rect x="450" y="565" width="240" height="50" fill="none" stroke="#2fa5e8" stroke-width="1.5" />
  <text x="470" y="599" class="txt-task">update</text>

  <!-- Legend -->
  <!-- Workflow Legend -->
  <rect x="500" y="660" width="60" height="20" fill="none" stroke="#111111" stroke-width="1.5" />
  <text x="575" y="676" class="txt-legend-black">Workflow</text>

  <!-- Task Legend -->
  <rect x="670" y="660" width="60" height="20" fill="none" stroke="#2fa5e8" stroke-width="1.5" />
  <text x="745" y="676" class="txt-legend-blue">Task</text>
</svg>