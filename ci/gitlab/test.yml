.template_test:
  stage: test
  tags:
    - linux
    - docker
  variables:
    ALLOW_INTERNAL_LABONEQ_BUILDS: "true"
    # Set to an empty string to run the job without the ZQCS backend.
    WITH_ZQCS: "true"
    MPLBACKEND: "AGG"
    UV_NO_SYNC: "1" # don't implicitly sync during "uv run"
    ZIPYPI_INDEX_URL: "https://artifactory.zhinst.com/artifactory/api/pypi/ZIPyPI/simple"
  before_script:
    - |
      if [[ $ALLOW_INTERNAL_LABONEQ_BUILDS == "true" ]]; then
        BASE_VERSION="$(uv version --short)"
        BASE_VERSION="${BASE_VERSION%.dev*}"
        # We assume that all release branch names start with "release-"
        if [[ "$CI_COMMIT_REF_NAME" =~ ^release- ]]; then
          PRERELEASE_TARGET="a0"
          PRERELEASE_UPPER="b0"
        else
          PRERELEASE_TARGET=".dev0"
          PRERELEASE_UPPER="a0"
        fi
        uv sync ${WITH_ZQCS:+--extra zqcs} --prerelease=if-necessary-or-explicit \
                --upgrade-package "laboneq>=${BASE_VERSION}${PRERELEASE_TARGET},<${BASE_VERSION}${PRERELEASE_UPPER}" \
                --index=$ZIPYPI_INDEX_URL
      else
        uv lock --upgrade-package laboneq --prerelease allow
        uv sync ${WITH_ZQCS:+--extra zqcs}
      fi
  script:
    - uv run pytest tests -n=auto -vv --ignore=tests/contrib
  rules:
    - !reference [.non_triggered]

test:python-3.10:
  extends: ".template_test"
  variables:
    UV_PYTHON: "3.10"

test:python-3.11:
  extends: ".template_test"
  variables:
    UV_PYTHON: "3.11"

test:python-3.12:
  extends: ".template_test"
  variables:
    UV_PYTHON: "3.12"

test:python-3.13:
  extends: ".template_test"
  variables:
    UV_PYTHON: "3.13"

test:python-3.10:laboneq-release:
  extends: ".template_test"
  variables:
    UV_PYTHON: "3.10"
    ALLOW_INTERNAL_LABONEQ_BUILDS: "false"
  allow_failure: true

test:coverage:
  extends: ".template_test"
  variables:
    UV_PYTHON: "3.10"
  script:
    - uv run pytest tests -v --ignore=tests/contrib --cov=laboneq_applications --cov=tests --cov-branch --cov-config=ci/coveragerc -n=auto
    - uv run coverage xml -o coverage.xml
    - uv run coverage html -d coverage_html
  artifacts:
    paths:
      - coverage_html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 day
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

test:docs_notebooks:python-3.10:
  extends: ".template_test"
  variables:
    UV_PYTHON: "3.10"
  script:
    - uv run ci/scripts/notebook_activate_folder_store.py docs
    - uv run pytest --nbmake docs/sources --nbmake-kernel=python --nbmake-timeout=240 -n=auto --durations=0

test:no_zqcs:
  extends: ".template_test"
  variables:
    WITH_ZQCS: ""

test:contrib_smoke_test:
  extends: ".template_test"
  script:
    - uv run pytest tests/contrib -n=auto -vv

test:laboneq-feature-branch:
  when: manual
  variables:
    VERSION: "OVERRIDE WITH LABONEQ VERSION"
    UV_NO_SYNC: "1" # don't implicitly sync during "uv run"
  stage: test
  script:
    - |
      uv sync --extra zqcs --prerelease=if-necessary-or-explicit \
              --upgrade-package laboneq==${VERSION} \
              --index=$LABONEQ_INDEX_URL
    - uv run pytest tests -n=auto -vv

.template_triggered_test:
  stage: test
  variables:
    LABONEQ_INDEX_URL: https://gitlab.zhinst.com/api/v4/projects/251/packages/pypi
    UV_NO_SYNC: "1" # don't implicitly sync during "uv run"
  before_script:
    - echo "Triggered by $UPSTREAM_PROJECT_PATH/$UPSTREAM_PROJECT_PATH"
    - echo "Running tests with laboneq version $LABONEQ_VERSION"
    - |
      uv sync --extra zqcs --prerelease=if-necessary-or-explicit \
              --upgrade-package laboneq==${LABONEQ_VERSION} \
              --index=$LABONEQ_INDEX_URL
  rules:
    - !reference [.triggered]

test:triggered-by-laboneq:
  extends: ".template_triggered_test"
  script:
    - uv run pytest tests -n=auto -vv --ignore=tests/contrib

test:docs-notebooks-triggered-by-laboneq:
  extends: ".template_triggered_test"
  script:
    - uv run ci/scripts/notebook_activate_folder_store.py docs
    - uv run pytest --nbmake docs/sources --nbmake-kernel=python --nbmake-timeout=240 -n=auto --durations=0
